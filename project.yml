name: Biblically

options:
  bundleIdPrefix: com.rehandominic
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"
    # ── Paste your 10-character Apple Developer Team ID below ──
    # Find it at developer.apple.com → Account → Membership
    # e.g.  DEVELOPMENT_TEAM: AB12CD34EF
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

# ─────────────────────────────────────────────
# TARGETS
# ─────────────────────────────────────────────
targets:

  # ── Main App ──────────────────────────────
  Biblically:
    type: application
    platform: iOS
    deploymentTarget: "16.0"

    sources:
      - path: Biblically

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rehandominic.biblically
        CODE_SIGN_ENTITLEMENTS: Biblically/Biblically.entitlements
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        INFOPLIST_KEY_CFBundleDisplayName: Biblically
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait

    dependencies:
      - target: BibllicallyWidget
        embed: true

  # ── Widget Extension ──────────────────────
  BibllicallyWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"

    sources:
      # Widget-only source files
      - path: BibllicallyWidget
      # Shared files — compiled into the widget too
      - path: Biblically/Models/Verse.swift
      - path: Biblically/Models/AppTheme.swift
      - path: Biblically/Shared/SharedDataManager.swift
      - path: Biblically/Data/verses_niv.json

    # XcodeGen generates Info.plist with the NSExtension key required by WidgetKit
    info:
      path: BibllicallyWidget/Info.plist
      properties:
        CFBundleDisplayName: BibllicallyWidget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rehandominic.biblically.widget
        CODE_SIGN_ENTITLEMENTS: BibllicallyWidget/BibllicallyWidget.entitlements
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"

# ─────────────────────────────────────────────
# SCHEMES
# ─────────────────────────────────────────────
schemes:

  # Main app scheme — builds both targets together
  Biblically:
    build:
      targets:
        Biblically: all
        BibllicallyWidget: all
    run:
      config: Debug
    archive:
      config: Release
    analyze:
      config: Debug

  # Widget-only scheme — _XCWidgetKind pre-set so it launches without error
  BibllicallyWidget:
    build:
      targets:
        BibllicallyWidget: all
    run:
      config: Debug
      environmentVariables:
        _XCWidgetKind: BibllicallyHomeWidget
    archive:
      config: Release
